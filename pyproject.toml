[project]
name = "jarvis-audio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.25.1", "ruamel.yaml==0.18.16"]

[project.optional-dependencies]
input = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "soxr==1.0.0"]
output = ["piper-tts==1.3.0", "soxr==1.0.0"]
benchmark = [
    "vosk==0.3.45",
]
wake-benchmark = [
    "onnxruntime==1.23.2; python_version < '3.11'",
    "onnxruntime==1.31.0; python_version >= '3.11'",
    "openwakeword==0.6.0",
]

[dependency-groups]
dev = ["mypy==1.18.2", "ruff==0.14.1", "types-jsonschema==4.25.1.20250822"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100
